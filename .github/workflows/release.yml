name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build HACS zip
        run: |
          cd custom_components/gemini_fastapi_multi_account
          zip -r ../../gemini_fastapi_multi_account.zip .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gemini_fastapi_multi_account.zip --title "$GITHUB_REF_NAME" --generate-notes
